default_category = "Uncategorised"

[paperless]
base_url = "https://paperless.cirriform.au"
api_token_env = "PAPERLESS_API_KEY"
accounts_tag_id = 14
processed_tag_id = 15

[parsers.anz]
method = "content"
correspondent_id = 11

[parsers.cba]
method = "local-mm-ocr"
provider = "glm-ocr"
correspondent_id = 133

[parsers.ing]
method = "content"
correspondent_id = 34

[local-mm-ocr]
temp_dir = ""
cleanup = false
ollama_host = "http://192.168.10.11:11434"
  [local-mm-ocr.glm-ocr]
  model = "glm-ocr:latest"
  context_length = 65536

# Income & Salary
[[categories]]
pattern = "SALARY|WAGE"
category = "Income"
transaction_type = "incoming"

# Allowances & Reimbursements
[[categories]]
